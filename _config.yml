title: EECS 245 Exams
tagline: Past exams for Mathematics for Machine Learning
description: "Past exams and solutions for EECS 245: Mathematics for Machine Learning at the University of Michigan."
author: EECS 245 course staff
baseurl: "/"
url: "https://exams.eecs245.org"
repository: eecs245/exams
port: 4001

exclude:
  - _site
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - scripts
  # The question tree: build input, never served. Excluded by GLOB on purpose:
  # jekyll-watch stops watching any exclude entry that exists on disk, so a
  # literal "src" would mean editing a config.yml under `jekyll serve` rebuilt
  # nothing. A glob matches no literal path, so src/ is not read, not
  # published, and still watched. (_sources needs no entry at all: Jekyll never
  # reads _-prefixed directories, and leaving it out keeps .tex edits watched.)
  - "src/*"
  # Composed exam pages and worksheets. Published by _plugins/composed_pages.rb;
  # excluded so Jekyll neither reads it as source nor rebuilds when it changes.
  - .build

theme: just-the-docs
color_scheme: um
search_enabled: true
heading_anchors: true
permalink: pretty

sass:
  quiet_deps: true
  silence_deprecations: ["import"]

aux_links_new_tab: true
aux_links:
  EECS 245:
    - "https://eecs245.org"
  Course Notes:
    - "https://notes.eecs245.org"

footer_content:

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

liquid:
  error_mode: strict
  strict_filters: true

# Callout used by generated exam pages for the instructions box
callouts:
  yellow:
    color: yellow

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
