{%- comment -%}
Loaded by the theme into <head> on every page. MathJax only where a page asks
for it (mathjax: true in front matter -- the composed exam pages and
worksheets).
{%- endcomment -%}
{%- if page.mathjax %}
<script>
window.MathJax = {
  tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
{%- endif %}
