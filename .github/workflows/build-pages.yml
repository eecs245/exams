name: Build exam pages and worksheets

# Keeps the COMMITTED exam pages and worksheets in sync with the questions.
# The live site does not depend on this: build-site.yml composes the same pages
# itself before deploying. This workflow only stops the checked-in index.md
# files drifting from what the site shows, so a diff of the repo is a diff of
# the site. (Its commit is made with GITHUB_TOKEN, so it cannot trigger
# build-site.yml -- and does not need to.)
#
# Workflow for a new exam:
#   1. Add its entry to _data/exams.yml and drop its folder (the .tex plus its
#      images) into _sources/exams/.
#   2. Preview locally with `jekyll serve` -- the _plugins/ hook runs
#      scripts/build.sh, which extracts the questions (needs pandoc; also
#      pdflatex and pdftocairo for a TikZ figure not already rendered).
#      Commit the new exams/<id>/ folder.
#   3. Append the new problems to _data/worksheet_topics.yml under their
#      chapters and push.

on:
  push:
    branches: [main]
    paths:
      - "exams/*/q*.md"
      - "_data/exams.yml"
      - "_data/worksheet_topics.yml"
      - "scripts/build.sh"
      - "scripts/compose.py"
      - "scripts/miniyaml.py"
      - "scripts/build_exam_pages.py"
      - "scripts/build_worksheets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the loop: the bot's own commit also touches paths above.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --compose-only: never re-extract in CI (see build-site.yml). Pure Python.
      - name: Compose exam pages and worksheets
        run: bash scripts/build.sh --compose-only

      - name: Commit regenerated pages
        run: |
          if git diff --quiet -- exams/ worksheets/; then
            echo "Pages already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exams/ worksheets/
          git commit -m "Recompose exam pages and worksheets from questions"
          git push
