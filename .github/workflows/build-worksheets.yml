name: Build topic worksheets

# Rebuilds worksheets/ whenever their inputs change: the generated exam web
# views (so LaTeX->HTML pipeline improvements flow through automatically) or
# the topic mapping itself. Worksheets are assembled from generated pages --
# no TeX or Pandoc needed here, only Python.
#
# Workflow for a new exam:
#   1. Run scripts/convert_exams.sh locally (needs pandoc) and commit the
#      generated exams/<name>/ page.
#   2. Append the new problems to _data/worksheet_topics.yml under their
#      chapters and push. This workflow rebuilds every affected worksheet.

on:
  push:
    branches: [main]
    paths:
      - "exams/*/index.md"
      - "_data/worksheet_topics.yml"
      - "scripts/build_worksheets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-worksheets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the loop: the bot's own worksheet commit also touches paths above.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build worksheets
        run: python3 scripts/build_worksheets.py

      - name: Commit regenerated worksheets
        run: |
          if git diff --quiet -- worksheets/; then
            echo "Worksheets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worksheets/
          git commit -m "Rebuild topic worksheets from updated exam pages"
          git push
