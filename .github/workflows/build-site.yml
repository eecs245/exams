name: build-site

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: "pages"
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Compose the exam pages and worksheets from the committed questions into
      # .build/, which _plugins/composed_pages.rb publishes during the Jekyll
      # build. Nothing composed is ever committed: the pages exist only in _site.
      # --compose-only: CI has no pandoc and no reason to convert LaTeX; the
      # questions in src/ are committed. Pure Python. This step is why a push
      # that changes only a question's config.yml still updates the live site.
      - name: Compose exam pages and worksheets
        run: bash scripts/build.sh --compose-only

      # SKIP_CONTENT_BUILD: the _plugins/ hook that runs build.sh for local
      # `jekyll serve` is inert here -- the step above already did its job.
      - name: Build site with Jekyll
        run: bundle exec jekyll build --source . --destination ./_site
        env:
          JEKYLL_ENV: production
          SKIP_CONTENT_BUILD: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
